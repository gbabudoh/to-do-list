<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';"
    />
    <title>Egobas Task Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="app-header">
      <div class="app-brand">
        <img class="app-logo" src="icon.png" alt="✓" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'" />
        <span class="app-logo app-logo-fallback" style="display:none">✓</span>
        <span class="app-title">Egobas Task Manager</span>
      </div>
      <div class="view-toggle">
        <button id="viewTasks" class="view-btn active" data-view="tasks">Tasks</button>
        <button id="viewTimeline" class="view-btn" data-view="timeline">Timeline</button>
      </div>
      <div class="header-stats">
        <span class="stat-pill" id="statActive">0 active</span>
        <span class="stat-pill" id="statTasks">0 tasks</span>
      </div>
    </header>

    <div class="app-body">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Projects</h2>
          <button id="newProjectBtn" class="icon-btn" title="New project">＋</button>
        </div>
        <ul id="projectList" class="project-list"></ul>
      </aside>

      <!-- Main content -->
      <main class="content" id="content"></main>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
